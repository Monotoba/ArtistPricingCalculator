name: Android validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install historical SDK components
        run: sdkmanager 'platforms;android-26' 'build-tools;26.0.2'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Build application and regression tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run SQLite regression tests on Android 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          disable-animations: true
          script: JAVA_HOME="$JAVA_HOME_8_X64" PATH="$JAVA_HOME_8_X64/bin:$PATH" ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
