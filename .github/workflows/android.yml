name: Android validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-build:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 37
            target: google_apis
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install historical SDK components
        run: sdkmanager 'platforms;android-26' 'build-tools;26.0.2'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Build application and regression tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run database and launch tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: JAVA_HOME="$JAVA_HOME_8_X64" PATH="$JAVA_HOME_8_X64/bin:$PATH" ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
