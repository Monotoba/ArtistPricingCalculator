name: Android validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            ram-size: 1536M
            heap-size: 256M
            gpu: swiftshader_indirect
          - api-level: '37.0'
            target: google_apis
            ram-size: 4096M
            heap-size: 576M
            gpu: software
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test emulator launcher and manifest integrity
        run: |
          python3 .github/scripts/test-emulator-scripts.py
          python3 .github/scripts/test-manifest-activities.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/wrapper-validation@v6
      - name: Install build SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build application and regression tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Verify AndroidX runtime dependencies
        run: |
          mkdir -p app/build/reports/dependencies
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/dependencies/debug-runtime.txt
          if grep -Eq 'com\.android\.support[:.]' app/build/reports/dependencies/debug-runtime.txt; then
            echo 'An old Android Support Library remains in the runtime graph.' >&2
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run database and launch tests
        if: matrix.api-level == 26
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram-size }}
          heap-size: ${{ matrix.heap-size }}
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-instrumented-tests.sh
      - name: Run tests after Android 17 services are ready
        if: matrix.api-level == '37.0'
        run: bash .github/scripts/run-modern-emulator.sh
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
